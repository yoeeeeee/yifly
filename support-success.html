<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>支持 yifly | yifly</title><link rel="stylesheet" href="support.css"><body><main class="details shell"><h1>感謝你支持 yifly ❤️</h1><p id="status">正在確認付款結果…</p><p><a href="support.html">回到支持頁</a></p></main><script type="module">import{paymentApiOrigin}from'./payment.js';const id=new URLSearchParams(location.search).get('orderId'),el=document.querySelector('#status');let attempts=0;async function check(){if(!id||!paymentApiOrigin){el.textContent='付款結果將由綠界確認。';return}try{const r=await fetch(`${paymentApiOrigin}/api/payment/status/${encodeURIComponent(id)}`);const o=await r.json();if(o.status==='paid'){el.textContent='贊助成功，謝謝你的支持 ❤️';return}if(o.status==='failed'){el.textContent='付款尚未完成';return}}catch{}if(++attempts<15)setTimeout(check,1000);else el.textContent='正在確認付款結果，請稍後回來查看。'}check()</script></body></html>
